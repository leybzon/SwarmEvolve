[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmevolve"
version = "0.1.0"
description = "Evolutionary testbed for LLM-driven drone swarm combat"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SwarmEvolve contributors" }]

dependencies = [
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "opencv-python>=4.9,<5",
    "jsonschema>=4.21,<5",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.34,<1",
    "google-generativeai>=0.7,<1",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "hypothesis>=6.100,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pre-commit>=3.7,<5",
    "pip-audit>=2.7,<3",
    "vcrpy>=6.0,<8",
]

[tool.setuptools]
package-dir = { "" = "scripts" }

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "SIM",              # simplify
    "RUF",              # ruff-specific
]
ignore = ["E501"]       # handled by line-length

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
no_implicit_reexport = true
files = ["scripts", "tests"]

[[tool.mypy.overrides]]
module = ["cv2.*", "matplotlib.*", "google.*", "vcr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "live_api: integration tests that call real LLM APIs (skipped by default)",
    "gpu: tests requiring an NVIDIA GPU",
    "docker: tests requiring a working Docker/Podman daemon",
    "slow: long-running tests (>10s)",
]

[tool.coverage.run]
branch = true
source = ["scripts"]
omit = ["tests/*"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
fail_under = 80
