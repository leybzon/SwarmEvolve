name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, mypy, clang-format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          sudo apt-get update -y
          sudo apt-get install -y clang-format
      - name: Ruff
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      - name: clang-format
        run: |
          FILES=$(find src tests -name '*.cpp' -o -name '*.h' -o -name '*.hpp' 2>/dev/null)
          if [ -n "$FILES" ]; then clang-format --dry-run -Werror $FILES; else echo "no C++ sources yet"; fi
      - name: AI banned-token lint
        run: |
          AI_FILES=$(find src/a src/b -name '*.cpp' -o -name '*.h' 2>/dev/null)
          if [ -n "$AI_FILES" ]; then python scripts/lint_ai_tokens.py $AI_FILES; else echo "no AI sources yet"; fi

  build-macos:
    name: Build (macOS / clang++)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          if [ -f src/engine.cpp ]; then make build-macos; else echo "engine.cpp not yet present; skipping"; fi

  build-linux-cpu:
    name: Build (Linux / g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          if [ -f src/engine.cpp ]; then make build-linux-cpu; else echo "engine.cpp not yet present; skipping"; fi

  test-cpp:
    name: Test C++ (with ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run C++ tests with sanitizers
        # Linux runs the sanitized build; macOS Homebrew-clang ASan runtime
        # is unreliable under SIP so `make test-cpp` (no SANITIZE) is the
        # default for local development.
        run: make test-cpp SANITIZE=1

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        run: python -m pytest --cov=scripts --cov-report=term --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  reproduce-smoke:
    name: Reproducibility smoke (M20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run mini-track twice against frozen mock LLM
        # Exits 0 only if the two back-to-back track_a runs produce the
        # same deterministic fingerprint. Divergence => exit 30.
        run: |
          python3 scripts/reproduce.py \
            --mini-config scripts/ci_fixtures/mini_track_a \
            --out-root build/mini_track_a \
            --seeds 1,2 \
            --generations 2 \
            --n-matches 3 \
            -v
      - name: Upload fingerprints on divergence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-fingerprints
          path: |
            build/mini_track_a/fingerprint_a.json
            build/mini_track_a/fingerprint_b.json
          if-no-files-found: ignore

  docs-check:
    name: Docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check that referenced docs exist
        run: |
          set -e
          for f in README.md ARCHITECTURE.md SPECIFICATION.md DEVELOPMENT.md \
                   IMPLEMENTATION_PLAN.md CLAUDE.md; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          # Ensure every markdown link to a local .md file resolves
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          bad = []
          for md in root.glob('*.md'):
              text = md.read_text()
              for m in re.finditer(r'\]\(([^)]+\.md)(?:#[^)]*)?\)', text):
                  target = (md.parent / m.group(1)).resolve()
                  if not target.exists():
                      bad.append(f"{md}: broken link -> {m.group(1)}")
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('all doc links OK')
          PY
